server:
  port: 8080

spring:
  application:
    name: ms-news
  datasource:
    url: jdbc:mysql://localhost:3306/newsdb?useSSL=false&serverTimezone=UTC
    username: root
    password: your_password
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: true

app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-string-at-least-32-bytes}
  auth:
    mode: remote          
    login-url: http://localhost:8081