server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: ms-login
  datasource:
    url: jdbc:mysql://localhost:3306/newsdb?useSSL=false&serverTimezone=UTC
    username: root
    password: your_password
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

app:
  jwt:
    secret: ${APP_JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}