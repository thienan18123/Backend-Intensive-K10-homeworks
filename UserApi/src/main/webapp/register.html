<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <script src="assets/js/login.js" defer></script>
</head>
<body>
<h1>Register</h1>
<form id="registerForm">
    <p><label>Name<br><input name="name" maxlength="100" required></label></p>
    <p><label>ID<br><input name="loginId" maxlength="50" required></label></p>
    <p><label>Password<br><input name="password" type="password" minlength="8" autocomplete="new-password" required></label></p>
    <button type="submit">Register</button>
    <p id="formError"></p>
</form>
<p>Already have an account? <a href="login.html">Login</a></p>
<p><a href="home.html">&laquo; Home</a></p>
